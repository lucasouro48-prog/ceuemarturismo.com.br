<style>

body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(2,6,23,.95);
  z-index:999;
}

.header-container{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 25px;
}

.brand{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}
.brand span:first-child{color:#fff;}
.brand span:last-child{color:var(--primary);}

nav{display:flex;gap:25px;}
nav a{color:#fff;text-decoration:none;}
nav a:hover{color:var(--primary);}

/* HERO */
.hero{
  margin-top:80px;
  background:
    linear-gradient(to right, rgba(2,6,23,.9), rgba(2,6,23,.4)),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
  background-size:cover;
  background-attachment:fixed;
  padding:120px 40px;
}

.hero h1{font-size:3rem;color:#fff;}
.hero p{max-width:600px;color:#cbd5f5;}

/* FILTROS */
.filters{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  margin:60px 0 30px;
}

.filters button{
  background:transparent;
  border:1px solid var(--primary);
  color:#fff;
  padding:10px 25px;
  border-radius:30px;
  cursor:pointer;
}

.filters button.active,
.filters button:hover{
  background:var(--primary);
  color:#020617;
}

/* GALERIA */
.section{padding:40px;}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:30px;
}

.item{
  background:var(--dark2);
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.05);
  opacity:0;
  transform:translateY(40px);
  transition:.6s;
}

.item.show{
  opacity:1;
  transform:translateY(0);
}

.item img{
  width:100%;
  height:220px;
  object-fit:cover;
  cursor:pointer;
  transition:.4s;
}

.item img:hover{transform:scale(1.05);}

.card-content{padding:20px;}
.card-content h3{margin:0 0 8px;color:#fff;}
.card-content p{font-size:.95rem;color:#cbd5f5;}

.rating{margin:8px 0;color:#facc15;font-size:14px;}

.card-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.card-actions a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:10px;
  font-size:14px;
  font-weight:bold;
  text-decoration:none;
}

.btn-whats{background:var(--primary);color:#020617;}
.btn-map{background:#1f2933;color:#fff;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.modal img{
  max-width:90%;
  max-height:90%;

<script>
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");

function openModal(img){
  modal.style.display="flex";
  modalImg.src=img.src;
}
function closeModal(){
  modal.style.display="none";
}

function filter(cat){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.item').forEach(i=>{
    i.style.display=(cat==="all"||i.classList.contains(cat))?"block":"none";
  });
}

const items=document.querySelectorAll('.item');
const obs=new IntersectionObserver(e=>{
  e.forEach(x=>x.isIntersecting&&x.target.classList.add("show"));
},{threshold:.2});
items.forEach(i=>obs.observe(i));
</script>
