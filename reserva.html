<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Reserva • CÉU E MAR </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#fbbf24;
  --dark:#020617;
  --dark2:#0f172a;
  --text:#e5e7eb;
}

body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:var(--dark);
  color:var(--text);
}

/* HEADER / MENU */
header{
  position:sticky;
  top:0;
  z-index:999;
  background:#020617;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:var(--primary);
}

nav{
  display:flex;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
}

nav a:hover{
  color:var(--primary);
}

/* MOBILE MENU */
.menu-btn{
  display:none;
  font-size:26px;
  color:#fff;
  cursor:pointer;
}

@media(max-width:800px){
  nav{
    position:absolute;
    top:70px;
    right:0;
    background:#020617;
    flex-direction:column;
    width:220px;
    display:none;
  }

  nav a{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.1);
    margin:0;
  }

  nav.show{
    display:flex;
  }

  .menu-btn{
    display:block;
  }
}

/* CONTAINER */
.container{
  max-width:720px;
  margin:80px auto;
  background:var(--dark2);
  padding:45px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.05);
}

.container h1{
  color:var(--primary);
  margin-bottom:10px;
}

.container p{
  color:#cbd5f5;
  margin-bottom:30px;
}

/* FORM */
input, select{
  width:100%;
  padding:15px;
  margin-bottom:16px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:#fff;
  font-size:15px;
}

button{
  width:100%;
  padding:16px;
  background:var(--primary);
  color:#020617;
  font-weight:bold;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  background:#020617;
  color:#94a3b8;
}
</style>
</head>

<body>

<header>
  <div class="logo">CÉU E MAR</div>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <nav id="menu">
    <a href="index.html">Início</a>
    <a href="passeios.html">Passeios</a>
    <a href="galeria.html">Galeria</a>
    <a href="contato.html">Contato</a>
    <a href="reserva.html">Reserva</a>
  </nav>
</header>

<div class="container">
  <h1>Reserva de Passeio</h1>
  <p>Preencha os dados abaixo para solicitar sua reserva com a VANTUR PRIME.</p>

  <input id="nome" placeholder="Nome completo">
  <input id="telefone" placeholder="WhatsApp">
  <input type="date" id="data">

  <select id="passeio">
    <option value="">Selecione o passeio</option>
    <option>Complexo Pipa</option>
    <option>São Miguel do Gostoso</option>
    <option>Galinhos</option>
    <option>Genipabu</option>
    <option>Maracajaú</option>
    <option>Barra do Cunhaú</option>
    <option>João Pessoa - PB</option>
  </select>

  <input type="number" id="pessoas" placeholder="Quantidade de pessoas">

  <button onclick="enviarReserva()">Enviar Reserva via WhatsApp</button>
</div>

<footer>
© 2026 CÉU E MAR • Turismo Executivo Premium
</footer>

<script>
function enviarReserva(){
  const nome=document.getElementById("nome").value;
  const tel=document.getElementById("telefone").value;
  const data=document.getElementById("data").value;
  const passeio=document.getElementById("passeio").value;
  const pessoas=document.getElementById("pessoas").value;

  if(!nome || !tel || !data || !passeio || !pessoas){
    alert("Preencha todos os campos.");
    return;
  }

  const msg=
`RESERVA VANTUR PRIME
Nome: ${nome}
Telefone: ${tel}
Passeio: ${passeio}
Data: ${data}
Pessoas: ${pessoas}`;

  window.open(
    "https://wa.me/5584996194981?text="+encodeURIComponent(msg),
    "_blank"
  );
}

function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
}
</script>

</body>
</html>
